<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050607">
    <meta name="description" content="Discover movies, television, anime, and cinematic franchises in the Alexandria archive.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://image.tmdb.org https://images.unsplash.com; frame-src 'self' https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://image.tmdb.org; object-src 'none'; base-uri 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Alexandria — Movie &amp; TV Archive</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="index.css?v=20260819v">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
</head>
<body class="sleek-premium-theme">
    <a class="skip-link" href="#content">Skip to content</a>
    <div id="loading-screen" role="status" aria-live="polite" aria-label="Loading Alexandria">
        <div class="loader-content">
            <div class="elegant-spinner"></div>
            <img src="logo.png" class="brand-logo loader-logo" alt="Alexandria">
            <p class="loader-status">We are the ones who live.</p>
        </div>
    </div>

    <div id="app" class="hidden layout-wrapper">
        <header class="top-nav">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <button id="sidebar-toggle" class="icon-btn" type="button" aria-label="Open navigation" aria-controls="primary-sidebar" aria-expanded="false">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="social-links" style="display: flex; gap: 0.5rem;">
                    <a href="https://t.me/Rxtribution" target="_blank" rel="noopener noreferrer" class="icon-btn" aria-label="Rxtribution on Telegram" title="@Rxtribution">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </a>
                    <a href="https://t.me/Yuntoez" target="_blank" rel="noopener noreferrer" class="icon-btn" aria-label="Yuntoez on Telegram" title="@Yuntoez">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </a>
                    <a href="https://discord.gg/sunPcs9Yst" target="_blank" rel="noopener noreferrer" class="icon-btn" aria-label="Discord Server" title="Discord">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M20.32 4.68A19.79 19.79 0 0 0 15.5 3c-.23.42-.5.98-.68 1.42a18.4 18.4 0 0 0-5.64 0C8.99 3.98 8.73 3.42 8.5 3a19.77 19.77 0 0 0-4.82 1.68C.63 9.95-.38 15.08.12 20.14A19.9 19.9 0 0 0 6.18 23c.49-.68.92-1.4 1.29-2.16a12.9 12.9 0 0 1-2.04-.98l.49-.38a14.18 14.18 0 0 0 12.16 0l.49.38c-.65.39-1.33.72-2.04.98.37.76.8 1.48 1.29 2.16a19.87 19.87 0 0 0 6.06-2.86c.58-5.9-.97-11.02-4.28-15.32zM8.02 16.86c-1.3 0-2.37-1.21-2.37-2.69s1.05-2.69 2.37-2.69 2.39 1.21 2.37 2.69c0 1.48-1.05 2.69-2.37 2.69zm7.96 0c-1.3 0-2.37-1.21-2.37-2.69s1.05-2.69 2.37-2.69 2.39 1.21 2.37 2.69c0 1.48-1.04 2.69-2.37 2.69z"></path></svg>
                    </a>
                </div>
            </div>
            <button class="header-brand brand-button" type="button" aria-label="Go to home">
                <img src="logo.png" class="brand-logo" alt="Alexandria">
            </button>
            <div class="top-nav-actions">
                <button id="search-trigger" class="icon-btn" type="button" aria-label="Search the archive" title="Search">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
                <button id="changelog-trigger" class="icon-btn changelog-trigger" type="button" aria-label="What's new" title="What's new" aria-haspopup="true" onclick="Alexandria.toggleChangelogMenu()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <span id="changelog-dot" class="changelog-dot" hidden></span>
                </button>
                <button id="auth-trigger" class="icon-btn auth-btn" type="button" aria-label="User Account" title="Account" aria-haspopup="true" onclick="Alexandria.toggleAccountMenu()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span id="auth-btn-label" class="auth-btn-label">Account</span>
                </button>
            </div>
            <div id="changelog-menu" class="account-menu changelog-menu" hidden></div>
            <div id="account-menu" class="account-menu" hidden></div>
        </header>

        <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

        <aside id="primary-sidebar" class="cyber-sidebar" aria-label="Primary navigation" inert>
            <div class="sidebar-header">
                <button class="sidebar-brand brand-button" type="button" aria-label="Go to home">
                    <img src="logo.png" class="brand-logo" alt="Alexandria">
                </button>
                <button id="sidebar-close" class="icon-btn close-btn" type="button" aria-label="Close navigation">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <nav class="main-nav">
                <a href="#home" class="nav-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg> Home</a>
                <a href="#movies" class="nav-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg> Movies</a>
                <a href="#tv" class="nav-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg> TV Shows</a>
                <a href="#anime" class="nav-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg> Anime</a>
                <a href="#franchises" class="nav-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg> Franchises</a>
                <a href="#history" class="nav-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> History</a>
                <a href="#watchlist" class="nav-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg> Watchlist</a>
            </nav>

            <div class="sidebar-footer">
                <div class="list-transfer">
                    <button type="button" id="export-lists-btn" class="btn-secondary list-transfer-btn">Export Lists</button>
                    <button type="button" id="import-lists-btn" class="btn-secondary list-transfer-btn">Import Lists</button>
                    <input type="file" id="import-lists-file" accept="application/json,.json" hidden>
                </div>
                <div class="system-status">
                    <div class="status-dot"></div>
                    <span class="status-text">OFFLINE</span>
                </div>
            </div>
        </aside>

        <main id="content" class="main-view" tabindex="-1">
            <div class="placeholder-msg">CONNECTING...</div>
        </main>

        <button id="back-to-top" type="button" title="Return to top" aria-label="Return to top" aria-hidden="true" tabindex="-1">↑</button>
    </div>

    <!-- User Auth Modal -->
    <div id="auth-modal" class="auth-modal-overlay" hidden onclick="if(event.target === this) Alexandria.toggleAuthModal(false)">
        <div class="auth-modal-card">
            <button class="auth-close-btn" type="button" onclick="Alexandria.toggleAuthModal(false)">✕</button>
            <div id="auth-modal-body"></div>
        </div>
    </div>

    <noscript><p class="noscript-message">Alexandria needs JavaScript enabled to load the archive.</p></noscript>
    <script defer src="script.js?v=20260819v"></script>
</body>
</html>
